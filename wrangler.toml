name = "sual-quran-agent"
main = "src/index.ts"
compatibility_date = "2026-02-16"

[observability]
enabled = true

[vars]
# Set from Cloudflare dashboard/wrangler for Turnstile widget rendering.
# Keep TURNSTILE_SECRET_KEY as a secret, not in this file.
TURNSTILE_SITE_KEY = ""

[[d1_databases]]
binding = "DB"
database_name = "quran-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
